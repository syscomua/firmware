<title>Танграм: 48 фігур</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Макет: каталог карточек-силуэтов -> экран фигуры: задание слева, шаги справа */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --ink: #18212b;
  --muted: #5b6774;
  --line: #d5dbe2;
  --fig: #1b232c;
  --fig-faint: #dfe4ea;
  --accent: #2f62d9;
  --accent-ink: #ffffff;
  --focus: #e8a530;
  --font-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161b; --surface: #1b2128; --ink: #e9eef3; --muted: #9aa6b2;
    --line: #2c353f; --fig: #e9eef3; --fig-faint: #2a333d; --accent: #6f95ff;
    --accent-ink: #0d1117; --focus: #f0b54a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161b; --surface: #1b2128; --ink: #e9eef3; --muted: #9aa6b2;
  --line: #2c353f; --fig: #e9eef3; --fig-faint: #2a333d; --accent: #6f95ff;
  --accent-ink: #0d1117; --focus: #f0b54a; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
h1, h2 { font-family: var(--font-display); font-weight: 700; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(28px, 5vw, 44px); line-height: 1.1; }
h2 { font-size: clamp(22px, 3.4vw, 30px); line-height: 1.15; }
p { margin: 0; }
.lead { color: var(--muted); max-width: 62ch; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* набор деталей */
.kit { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.kit-item { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--muted); }
.kit-item svg { width: 34px; height: 34px; flex: none; }

/* фильтры */
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 8px 16px; font-size: 15px; font-weight: 500;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* каталог */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.card {
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px;
  padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 8px; text-align: left;
  transition: border-color .15s, transform .15s;
}
.card:hover { border-color: var(--accent); transform: translateY(-2px); }
.card svg { width: 100%; aspect-ratio: 1; max-width: 100%; }
.card-name { font-weight: 600; font-size: 16px; line-height: 1.25; }
.card-meta { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); display: block; }
.dots i.on { background: var(--ink); }

/* экран фигуры */
.topbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.back { border: none; background: none; padding: 6px 0; font-weight: 600; color: var(--accent); font-size: 16px; }
.pager { display: flex; gap: 8px; }
.btn {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px;
  padding: 10px 18px; font-weight: 600; font-size: 16px; min-height: 48px;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .4; cursor: default; }
.detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 820px) { .detail { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel-title { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
.stage svg { width: 100%; aspect-ratio: 1; max-width: 100%; display: block; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg .chip { font-size: 14px; padding: 7px 13px; }
.step-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.step-count { font-family: var(--font-display); font-size: 20px; font-variant-numeric: tabular-nums; }
.step-text { font-size: clamp(19px, 2.4vw, 23px); line-height: 1.45; font-weight: 500; min-height: 4.5em; }
.swatch { display: inline-block; width: .8em; height: .8em; border-radius: 3px; vertical-align: -0.05em; margin-right: .3em; }
.steps-list { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.steps-list button {
  width: 100%; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start;
  text-align: left; background: none; border: 1.5px solid transparent; border-radius: 10px; padding: 8px 10px; font-size: 15px; color: var(--muted);
}
.steps-list button[aria-current="step"] { border-color: var(--line); background: var(--bg); color: var(--ink); }
.steps-list .n { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); }
.done { font-size: 20px; font-weight: 600; }
.note { font-size: 15px; color: var(--muted); max-width: 70ch; }
.howto { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.howto div { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.howto b { font-size: 16px; }
.howto span { font-size: 15px; color: var(--muted); }
@keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .55 } }
.current { animation: pulse 1.6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .current { animation: none; } .card { transition: none; } }
</style>

    el("p", {class: "lead"}, "Фігури з аркуша «Розвиваюча гра «Танграм»». Кожна складається з усіх семи деталей набору. Оберіть фігуру — відкриється завдання та покрокове складання.")));

  const kit = el("div", {class: "kit", "aria-label": "Деталі набору"});
  for (const n of ["L1", "L2", "M", "Q", "P", "S1", "S2"]) kit.append(el("div", {class: "kit-item"}, pieceIcon(n), PIECE_NAMES[n]));
  app.append(kit);

  app.append(el("div", {class: "howto"},
    el("div", {}, el("b", {}, "1. Лише силует"), el("span", {}, "Найважчий рівень. Пацієнт сам здогадується, де яка деталь.")),
    el("div", {}, el("b", {}, "2. Силует з лініями"), el("span", {}, "Видно межі деталей. Можна викладати деталі просто на екран або роздруківку.")),
    el("div", {}, el("b", {}, "3. Покроково"), el("span", {}, "Одна деталь за крок: кольорова підказка й коротка фраза, куди її покласти."))));

  const filters = el("div", {class: "filters", role: "group", "aria-label": "Складність"});
  [[0, "Усі"], [1, "Легкі"], [2, "Середні"], [3, "Складні"]].forEach(([v, t]) => {
    filters.append(el("button", {class: "chip", "aria-pressed": String(filter === v), on: {click: () => { filter = v; renderCatalog(); }}}, t));
  });
  app.append(filters);

  const grid = el("div", {class: "grid"});
  DATA.forEach((fig, i) => {
    if (filter && fig.level !== filter) return;
    const dots = el("span", {class: "dots", "aria-label": "складність: " + LEVELS[fig.level]});
    for (let k = 1; k <= 3; k++) dots.append(el("i", {class: k <= fig.level ? "on" : ""}));
    grid.append(el("button", {class: "card", on: {click: () => { location.hash = fig.id; }}},
      figureSvg(fig, "sil"),
      el("span", {class: "card-name"}, fig.name),
      el("span", {class: "card-meta"}, el("span", {}, "№ " + (i + 1) + (fig.adapted ? " · спрощена" : "")), dots)));
  });
  app.append(grid);
  app.append(el("p", {class: "note"}, "Назви фігур дібрано за малюнками з аркуша. Силуети відновлено з фото аркуша. Фігури з позначкою «спрощена» складено за мотивами малюнка, вони відрізняються від аркуша в деталях. Кожен силует тут точно складається із семи деталей."));
}

function renderFigure(idx) {
  const fig = DATA[idx];
  document.title = fig.name + " — танграм";
  const total = fig.steps.length;
  app.replaceChildren();

  const prevFig = idx > 0 ? DATA[idx - 1] : null, nextFig = idx < DATA.length - 1 ? DATA[idx + 1] : null;
  app.append(el("div", {class: "topbar"},
    el("button", {class: "back", on: {click: () => { location.hash = ""; }}}, "← Усі фігури"),
    el("div", {class: "pager"},
      el("button", {class: "btn", ...(prevFig ? {} : {disabled: ""}), on: {click: () => prevFig && (location.hash = prevFig.id)}}, "← Попередня"),
      el("button", {class: "btn", ...(nextFig ? {} : {disabled: ""}), on: {click: () => nextFig && (location.hash = nextFig.id)}}, "Наступна →"))));

  app.append(el("h2", {}, `№ ${idx + 1}. ${fig.name}`));
  if (fig.adapted) app.append(el("p", {class: "note"}, "Цю фігуру складено за мотивами малюнка з аркуша: загальний вигляд той самий, але деталі лежать трохи інакше. Давайте пацієнтові силует звідси, а не з аркуша."));

  // задание
  const task = el("section", {class: "panel"});
  task.append(el("div", {class: "panel-title"}, "Завдання"));
  const seg = el("div", {class: "seg", role: "group", "aria-label": "Підказка"});
  [["sil", "Лише силует"], ["lines", "З лініями"], ["color", "Готова схема"]].forEach(([m, t]) => {
    seg.append(el("button", {class: "chip", "aria-pressed": String(state.mode === m), on: {click: () => { state.mode = m; renderFigure(idx); }}}, t));
  });
  task.append(seg);
  task.append(el("div", {class: "stage"}, figureSvg(fig, state.mode)));
  task.append(el("p", {class: "note"}, "Складіть таку саму фігуру з усіх семи деталей. Деталі не повинні налазити одна на одну."));

  // шаги
  const steps = el("section", {class: "panel"});
  steps.append(el("div", {class: "panel-title"}, "Покрокове складання"));
  const s = Math.min(state.step, total);
  steps.append(el("div", {class: "stage"}, figureSvg(fig, "step", s)));
  const head = el("div", {class: "step-head"},
    el("span", {class: "step-count"}, s < total ? `Крок ${s + 1} з ${total}` : "Готово!"),
    el("div", {class: "pager"},
      el("button", {class: "btn", ...(s > 0 ? {} : {disabled: ""}), on: {click: () => { state.step = s - 1; renderFigure(idx); }}}, "Назад"),
      el("button", {class: "btn primary", ...(s < total ? {} : {disabled: ""}), on: {click: () => { state.step = s + 1; renderFigure(idx); }}}, "Далі")));
  steps.append(head);
  steps.append(s < total ? el("p", {class: "step-text"}, textWithSwatch(fig.steps[s]))
                         : el("p", {class: "step-text done"}, `Фігуру «${fig.name}» складено. Порівняйте її із силуетом зліва.`));
  const list = el("ol", {class: "steps-list"});
  fig.steps.forEach((st, i) => {
    list.append(el("li", {}, el("button", {...(i === s ? {"aria-current": "step"} : {}), on: {click: () => { state.step = i; renderFigure(idx); }}},
      el("span", {class: "n"}, String(i + 1)), textWithSwatch(st))));
  });
  steps.append(list);

  app.append(el("div", {class: "detail"}, task, steps));
}

function route() {
  const id = location.hash.slice(1);
  const idx = DATA.findIndex(f => f.id === id);
  if (idx >= 0) {
    if (state.fig !== idx) state = {mode: "sil", step: 0, fig: idx};
    renderFigure(idx);
  } else {
    state = {mode: "sil", step: 0};
    renderCatalog();
  }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
document.addEventListener("keydown", e => {
  if (state.fig == null || !location.hash) return;
  const total = DATA[state.fig].steps.length;
  if (e.key === "ArrowRight" && state.step < total) { state.step++; renderFigure(state.fig); }
  if (e.key === "ArrowLeft" && state.step > 0) { state.step--; renderFigure(state.fig); }
});
route();
</script>
